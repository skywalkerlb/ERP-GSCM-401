name: Publish Glazed to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_APP_BASE_PATH: /${{ github.event.repository.name }}/
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      VITE_DEMO_SUPABASE_URL: ${{ secrets.VITE_DEMO_SUPABASE_URL }}
      VITE_DEMO_SUPABASE_ANON_KEY: ${{ secrets.VITE_DEMO_SUPABASE_ANON_KEY }}
      VITE_DEMO_PASSWORD: ${{ secrets.VITE_DEMO_PASSWORD }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Install seed verification dependencies
        run: npm ci --prefix scripts/seed
      - name: Check frontend configuration
        run: node -e 'for (const key of ["VITE_SUPABASE_URL", "VITE_SUPABASE_ANON_KEY"]) { if (!process.env[key]) throw new Error(key + " is missing from repository Actions secrets"); }'
      - name: Verify application
        run: |
          node --test scripts/verify/*.test.mjs
          npm run lint:design
      - name: Build the public site
        run: npm run build
      - name: Preserve direct page links
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Publish
        id: publish
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
